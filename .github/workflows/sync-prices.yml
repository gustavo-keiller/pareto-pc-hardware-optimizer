name: sync-store-prices

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  validate-and-sync-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:feeds
      - run: npm run check:catalogs
